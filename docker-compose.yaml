services:
  postgres:
    image: postgres:17-alpine
    container_name: abeta-layout-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-layout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-layout}
      POSTGRES_DB: ${POSTGRES_DB:-layout_engine}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-layout} -d ${POSTGRES_DB:-layout_engine}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  layout-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abeta-layout-engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8090}:8090"
    environment:
      SERVICE_NAME: ${SERVICE_NAME:-abeta-layout-engine}
      PORT: "8090"
      GIN_MODE: ${GIN_MODE:-release}
      DB_DIALECT: postgres
      DB_DSN: ${DB_DSN:-postgres://layout:layout@postgres:5432/layout_engine?sslmode=disable}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      SEED_STARTER_DATA: ${SEED_STARTER_DATA:-true}
      DEFAULT_TENANT: ${DEFAULT_TENANT:-abeta-fresh}
      COMPRESSION_ENABLED: ${COMPRESSION_ENABLED:-true}
      ETAG_ENABLED: ${ETAG_ENABLED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      TOKEN_CATALOG_VERSION: ${TOKEN_CATALOG_VERSION:-1.0.0}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
